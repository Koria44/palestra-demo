name: Integracion Continua y Seguridad PALESTRA

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  calidad-seguridad-y-pruebas:
    name: Linter, Secretos, Auditoria y Pruebas (>80% Cobertura)
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.desarrollo
      SECRET_KEY: clave-ci-exclusiva-para-pruebas-automatizadas-longitud-mayor-a-50-caracteres
      DEBUG: "True"
      USAR_SQLITE_LOCAL: "True"
      CLAVE_CIFRADO_CAMPOS: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      CLAVE_INDICE_CIEGO: clave-hmac-ci-pruebas-automatizadas-palestra

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de secretos en el repositorio e historial Git (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.12+
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias fijadas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Analisis estatico de codigo con Ruff
        run: |
          ruff check apps config pruebas manage.py

      - name: Auditoria de vulnerabilidades en dependencias (pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Verificar ausencia de migraciones pendientes en Django
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Instalar navegador Chromium para pruebas E2E (Playwright)
        run: |
          playwright install --with-deps chromium

      - name: Ejecutar suite de pruebas automatizadas con cobertura minima del 80%
        run: |
          pytest --cov=apps --cov-report=term-missing --cov-fail-under=80 pruebas/
